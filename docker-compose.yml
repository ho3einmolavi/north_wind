version: "3.8"

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: northwind
      POSTGRES_PASSWORD: northwind
      POSTGRES_DB: northwind
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U northwind -d northwind"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mock-provider:
    build:
      context: ./mock-provider
    environment:
      PAYMENT_WEBHOOK_SECRET: whsec_nw_local_dev_2f9c1a7b
      APP_WEBHOOK_URL: http://app:3000/webhooks/payment
      PORT: "4000"
    ports:
      - "4000:4000"
    depends_on:
      - app

  app:
    build:
      context: .
    env_file:
      - .env.example
    environment:
      PGHOST: postgres
      REDIS_HOST: redis
      PAYMENT_PROVIDER_URL: http://mock-provider:4000
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
